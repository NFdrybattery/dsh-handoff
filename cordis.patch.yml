# dsh-handoff bundle patch.
#
# Applied as a profile patch layer after every in-box bundle. Inserts one row
# at the profile root; a later layer (or the user's own cordis.patch.yml) can
# address it by id and override `config` with the last write winning.
- insert:
    - id: dsh-handoff
      name: 'dsh-handoff'
      config: {}
